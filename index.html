<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progressive Materialist Naturalism (PMN) — Reader & AI Grounding Platform</title>
    <meta name="description" content="Official reader platform and canonical AI grounding ecosystem for Progressive Materialist Naturalism (PMN) v126 by Nova Dharma. Non-ideal materialist philosophy, anti-capture forensics, and the biological floor." />
    <meta name="keywords" content="Progressive Materialist Naturalism, PMN, Nova Dharma, philosophy, institutional capture, biological floor, AI grounding, llms.txt, materialist ethics" />
    <meta name="author" content="Nova Dharma" />
    <meta name="theme-color" content="#0d0d0d" />

    <!-- Google Search Console ownership proof for the URL-prefix property
         https://novadharma-hub.github.io/pmn-framework/ (added 2026-09-23).
         Public by design; removing it un-verifies the property. -->
    <meta name="google-site-verification" content="JowFFbemKP1ExUjOVoaEpTwH9plWlobaDzD5ZdXcetM" />

    <!-- Canonical & Open Graph -->
    <link rel="canonical" href="https://novadharma-hub.github.io/pmn-framework/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://novadharma-hub.github.io/pmn-framework/" />
    <meta property="og:title" content="Progressive Materialist Naturalism (PMN) — v126" />
    <meta property="og:description" content="A comprehensive naturalist philosophical framework analyzing material reality, dismantling structural capture, and protecting the biological floor." />
    <meta property="og:site_name" content="PMN Framework" />
    <meta property="og:image" content="https://novadharma-hub.github.io/pmn-framework/icons/pwa-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://novadharma-hub.github.io/pmn-framework/icons/pwa-512.png" />
    <meta name="twitter:title" content="Progressive Materialist Naturalism (PMN) — v126" />
    <meta name="twitter:description" content="Official interactive reader platform and canonical AI grounding specification by Nova Dharma." />

    <!-- Machine-readable entry points. The body below is filled by JavaScript,
         so these are what a crawler that does not run JS can follow. -->
    <link rel="alternate" type="text/plain" title="llms.txt" href="https://novadharma-hub.github.io/pmn-framework/llms.txt" />
    <link rel="sitemap" type="application/xml" href="https://novadharma-hub.github.io/pmn-framework/sitemap.xml" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Book",
      "name": "Progressive Materialist Naturalism (PMN)",
      "alternateName": "PMN Framework",
      "author": { "@type": "Person", "name": "Nova Dharma" },
      "inLanguage": "en",
      "genre": "Philosophy",
      "license": "https://creativecommons.org/licenses/by-sa/4.0/",
      "url": "https://novadharma-hub.github.io/pmn-framework/",
      "sameAs": ["https://github.com/novadharma-hub/pmn-framework"],
      "workExample": [
        { "@type": "Book", "bookFormat": "https://schema.org/EBook", "url": "https://novadharma-hub.github.io/pmn-framework/read/" },
        { "@type": "Book", "bookFormat": "https://schema.org/EBook", "encodingFormat": "application/pdf", "url": "https://novadharma-hub.github.io/pmn-framework/PMN_Latest.pdf" }
      ]
    }
    </script>

    <!-- The static contents list inside #root is for readers without JS
         (crawlers, AI fetchers). With JS it is hidden before first paint and
         then replaced by React, so it never flashes. -->
    <script>document.documentElement.classList.add('js')</script>
    <style>.js #static-fallback{display:none}#static-fallback{max-width:42rem;margin:0 auto;padding:1.5rem 16px;font-family:Georgia,serif;line-height:1.6}</style>

    <!-- Web App Manifest: injected by vite-plugin-pwa with the /pmn-framework/
         base. A hand-written link here pointed at /manifest.webmanifest on the
         bare host, which is a 404, and sat next to the correct one. -->

    <!-- Typography: self-hosted, no third party. Until 2026-09-17 this block
         loaded webfonts from a CDN, so every visitor was disclosed to it before
         the page rendered. Rationale and @font-face rules: src/index.css.
         The two faces that paint first are preloaded to keep the swap short.
         No CDN hostname is written anywhere in this file on purpose, so a
         repo-wide search for one returning zero is a check that stays honest. -->
    <link rel="preload" href="/fonts/Lora-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/LibreBaskerville-700.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div id="root"><!-- STATIC_FALLBACK --></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
