name: Deploy PMN Framework to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Security: Add branch protection for main branch
# Ensure only authorized users can push to main

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # "npm run build" ends with "python3 scripts/build_pdf.py" (T4: the PDF is a
      # build output of the corpus). The runner has python3 but not reportlab, so
      # every deploy since that change failed at the last step -- the site kept
      # serving the previous successful build while main moved on.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --quiet reportlab

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Bing, and through it ChatGPT search, Copilot and DuckDuckGo, learns
      # every URL in sitemap.xml without anyone logging in anywhere. Never
      # fails the deploy; see scripts/indexnow_ping.py.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: python3 scripts/indexnow_ping.py
